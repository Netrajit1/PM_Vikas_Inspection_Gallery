<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
}

/* =====================================
   WHITE LOGO BELT
===================================== */

.logo-belt {
    width: 100%;
    height: 350px;

    overflow: hidden;

    background: #ffffff;

    display: flex;
    align-items: center;
}


/* =====================================
   MOVING TRACK
===================================== */

.logo-track {

    display: flex;
    align-items: center;

    width: max-content;

    animation: scroll 50s linear infinite;
}

.logo-belt:hover .logo-track {
    animation-play-state: paused;
}


/* =====================================
   WHITE LOGO BOX
===================================== */

.logo-item {

    width: 220px;
    height: 250px;

    flex: 0 0 220px;

    margin: 0 18px;

    background: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 14px;

    /* CLEAR BOX */
    border: 1px solid #e5e7eb;

    /* SHADOW */
    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.12);

    overflow: hidden;

    transition: all 0.3s ease;
}


/* =====================================
   HOVER EFFECT
===================================== */

.logo-item:hover {

    transform: translateY(-4px);

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.16);
}


/* =====================================
   LARGE LOGO
===================================== */

.logo-item img {

    width: 190px;
    height: 180px;

    object-fit: contain;

    display: block;
}


/* =====================================
   SMOOTH INFINITE SCROLL
===================================== */

@keyframes scroll {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }

}


/* =====================================
   TABLET
===================================== */

@media (max-width: 1000px) {

    .logo-belt {
        height: 220px;
    }

    .logo-item {

        width: 200px;
        height: 140px;

        flex-basis: 200px;

        margin: 0 15px;
    }

    .logo-item img {

        width: 175px;
        height: 115px;
    }

}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 768px) {

    .logo-belt {
        height: 190px;
    }

    .logo-item {

        width: 180px;
        height: 125px;

        flex-basis: 180px;

        margin: 0 10px;
    }

    .logo-item img {

        width: 160px;
        height: 105px;
    }

    .logo-track {
        animation-duration: 40s;
    }

}

</style>

</head>
